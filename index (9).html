*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 14px 100px}

.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:8px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.v{font-size:20px;font-weight:600;margin-top:2px}

.sec{font:600 11px "Inter",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:20px 2px 8px}

svg path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .9s ease forwards}

.meter{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;border-radius:4px;transition:width .6s}
.sk{position:relative;overflow:hidden;min-height:110px;border-radius:20px;background:var(--card);border:1px solid var(--bd)}

@keyframes sh{to{transform:translateX(100%)}}

}

function vCal(){
  const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const day={},cnt={};for(const t of trades){const k=t.date.slice(0,10);day[k]=(day[k]||0)+net(t);cnt[k]=(cnt[k]||0)+1}
  const tk=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const keys=[];for(let d=1;d<=days;d++)keys.push(`${y}-${pad(m+1)}-${pad(d)}`);
  const ac=keys.filter(k=>day[k]!==undefined),mt=ac.reduce((a,k)=>a+day[k],0),gd=ac.filter(k=>day[k]>0).length,rd=ac.filter(k=>day[k]<0).length;
  const bk=ac.length?ac.reduce((a,k)=>day[k]>day[a]?k:a,ac[0]):null,wk=ac.length?ac.reduce((a,k)=>day[k]<day[a]?k:a,ac[0]):null;
  const tile=(k,v,x)=>`<div class="tile"><div class="k">${k}</div><div class="v ${x||""}">${v}</div></div>`;
  let h=`<div class="card"><div class="tr" style="align-items:center;margin-bottom:10px"><button class="btn s sm" onclick="act('mon',-1)" aria-label="Previous month">‹</button><div style="text-align:center"><b>${calM.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><div class="sub ${cls(mt)}">${money(mt)}</div></div><button class="btn s sm" onclick="act('mon',1)" aria-label="Next month">›</button></div><div class="cal">`;
  for(const d of ["S","M","T","W","T","F","S"])h+=`<div class="h">${d}</div>`;
  for(let i=0;i<first;i++)h+=`<div></div>`;
  for(const k of keys){
    const v=day[k],bg=v==null?"":`background:color-mix(in srgb,var(${v>=0?"--g":"--r"}) 24%,var(--bg))`,d=+k.slice(8);
    h+=`<button class="${k===selDay?"sel":""}${k===tk?" today":""}" style="${bg}" aria-label="${k}${v==null?", no trades":`, ${cnt[k]} trade${cnt[k]===1?"":"s"}, ${money(v)}`}" onclick="act('day','${k}')">${reviews[k]?`<i class="rv">✎</i>`:""}${d}${v==null?"":`<small class="${cls(v)}">${Math.abs(v)>=1000?(v/1000).toFixed(1)+"k":Math.round(v)}</small>`}</button>`;
  }
  h+=`</div><div class="tr" style="margin-top:10px;align-items:center"><span class="sub">✎ = daily review written</span><button class="btn s sm" onclick="act('today')">Today</button></div></div>`;
  h+=`<div class="tiles">${tile("Month P/L",money(mt),cls(mt))}${tile("Trading days",ac.length)}${tile("Green / red",gd+" / "+rd)}${tile("Day win rate",ac.length?(gd/ac.length*100).toFixed(0)+"%":"—")}${tile("Best day",bk?money(day[bk]):"—","g")}${tile("Worst day",wk&&day[wk]<0?money(day[wk]):"—","r")}</div>`;
  if(selDay){
    const dt=trades.filter(t=>t.date.slice(0,10)===selDay),dm=M(dt);
    h+=`<div class="card" style="margin-top:12px"><h2>${esc(selDay)}${dt.length?` · <span class="${cls(dm.p)}">${money(dm.p)}</span>`:""}</h2>`+(dt.length?`<div class="sub" style="margin-bottom:6px">${dt.length} trade${dt.length===1?"":"s"} · win rate ${dm.wr.toFixed(0)}%. Tap a trade for details.</div>`+dt.map(t=>`<div class="dayrow" onclick="openTrade('${t.id}')"><span>${esc(t.symbol)} ${t.side==="buy"?"buy":"sell"} · ${t.lots}</span><b class="${cls(net(t))}">${money(net(t))}</b></div>`).join(""):`<div class="sub">No trades recorded this day.</div>`)
     +`<label for="f_rev">Daily review</label><textarea id="f_rev" placeholder="What went well? What would you change?" oninput="reviewInput(this.value)">${esc(reviews[selDay]||"")}</textarea></div>`;
  }else h+=`<div class="sub" style="text-align:center;margin-top:10px">Tap a day to see its trades and write a review.</div>`;
  return h;
}

async function shrink(f){
  const b=await createImageBitmap(f),k=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement("canvas");
  c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",.82));
}
async function upShot(inp){

  if(!/^image\//.test(f.type)){m.textContent="Please choose an image.";return}
  m.textContent="Uploading…";
  try{
    const blob=await shrink(f),p=`${uidG}/${Date.now().toString(36)}.jpg`;
    const {error}=await sb.storage.from("charts").upload(p,blob,{contentType:"image/jpeg"});

  }catch(e){m.textContent="Upload failed: "+((e&&e.message)||"error")}

async function submit(){
  const g=id=>document.getElementById(id).value.trim(),num=id=>g(id)===""?null:Number(g(id));
  const t={acct:active,date:g("f_date"),symbol:symVal(),side:g("f_side"),lots:num("f_lots"),entry:num("f_en"),exit:num("f_ex"),pnl:num("f_pnl"),fees:g("f_fee")===""?0:Number(g("f_fee")),sl:num("f_sl"),tp:num("f_tp"),risk:num("f_risk"),setup:g("f_setup"),mood:g("f_mood"),notes:g("f_notes"),shot,link:g("f_link")};
  const bad=[];
  if(!t.date)bad.push("date & time");
  if(!t.symbol)bad.push("symbol");
  for(const [k,l] of [["lots","lots"],["entry","entry price"],["exit","exit price"]])if(!(t[k]>0))bad.push(l+" (must be above 0)");
  if(t.pnl===null||!isFinite(t.pnl))bad.push("profit / loss");
  if(t.link&&!/^https?:\/\/\S+$/i.test(t.link))bad.push("chart link (must start with http)");
  for(const [k,l] of [["fees","fees"],["sl","stop loss"],["tp","take profit"],["risk","risk amount"]])if(t[k]!==null&&(!isFinite(t[k])||t[k]<0))bad.push(l+" (invalid)");
  if(bad.length){errMsg="Please check: "+bad.join(", ")+".";$("#err").textContent=errMsg;return}
  errMsg="";
  const id=edit?edit.id:"t_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  edit=null;shot="";tab="trades";render();
  await save(id,t);
}
function csv(){
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const cols=["date","symbol","side","lots","entry","exit","sl","tp","pnl","fees","risk","setup","mood","notes"];
  const rows=[cols.join(",")].concat(trades.map(t=>cols.map(c=>q(t[c])).join(",")));
  const data=rows.join("\n");
  if(dl){dl.save({filename:"trades.csv",data}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download="trades.csv";document.body.appendChild(a);a.click();a.remove();
}
function act(a,x){
  if(a==="tab"){tab=x;pageAnim=true;eqAnim=true;edit=null;delId=null;shot="";errMsg=""}
  else if(a==="edit"){edit=trades.find(t=>t.id===x)||null;shot=edit&&edit.shot||"";tab="add"}
  else if(a==="del"){if(delId===x){delId=null;const tt=trades.find(z=>z.id===x);if(tt&&tt.shot&&sb)sb.storage.from("charts").remove([tt.shot]);remove(x)}else delId=x}
  else if(a==="mon"){calM=new Date(calM.getFullYear(),calM.getMonth()+x,1)}
  else if(a==="day"){selDay=x}
  else if(a==="back"){tab=prevTab||"trades";pageAnim=true}
  else if(a==="today"){const n=new Date();calM=new Date(n.getFullYear(),n.getMonth(),1);selDay=new Date(n.getTime()-n.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
  else if(a==="csv"){csv();return}

(function(){
  const c=document.getElementById("bg"),x=c.getContext("2d"),reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const UP="#22c55e",DN="#ef4444",T=40;
  let W=0,H=0,cw=10,gap=5,candles=[],cur,price=2650.0,vol=1.1,ticks=0,off=0,lo=2640,hi=2660,last=0,acc=0;
  const g=()=>{let u=0;for(let i=0;i<6;i++)u+=Math.random();return(u-3)/.707};
  const fresh=()=>{const o=cur?cur.c:price;return{o,h:o,l:o,c:o}};
  function tick(){
    vol=Math.max(.4,Math.min(2.6,vol*.96+.04*1.1+Math.abs(g())*.05));
    price+=g()*vol*.55+(Math.random()<.015?g()*vol*3:0);
    cur.c=price;cur.h=Math.max(cur.h,price);cur.l=Math.min(cur.l,price);
    if(++ticks>=T){ticks=0;candles.push(cur=fresh());if(candles.length>90)candles.shift();off+=cw+gap}
  }
  function size(){
    const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    cw=Math.max(7,Math.min(14,W/38));gap=Math.max(3,cw*.45);
  }
  function range(){
    const n=Math.ceil(W*.9/(cw+gap)),v=candles.slice(-n);let a=1e9,b=-1e9;
    for(const k of v){if(k.l<a)a=k.l;if(k.h>b)b=k.h}
    const pad=(b-a)*.18+.5;lo+=(a-pad-lo)*.04;hi+=(b+pad-hi)*.04;
  }
  const Y=p=>H*.1+(1-(p-lo)/(hi-lo))*H*.62;
  function draw(){
    x.globalCompositeOperation="source-over";x.clearRect(0,0,W,H);
    x.strokeStyle="rgba(128,140,170,.09)";x.lineWidth=1;
    for(let i=1;i<9;i++){const y=H*.1+H*.62*i/9;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
    const xr=W*.82,n=candles.length;
    for(let i=0;i<n;i++){
      const k=candles[i],cx=xr-(n-1-i)*(cw+gap)-off;if(cx<-cw||cx>W+cw)continue;
      const up=k.c>=k.o,col=up?UP:DN,yo=Y(k.o),yc=Y(k.c),top=Math.min(yo,yc),h=Math.max(1.5,Math.abs(yo-yc));
      x.globalAlpha=.8;x.strokeStyle=col;x.fillStyle=col;x.lineWidth=1.4;
      x.beginPath();x.moveTo(cx,Y(k.h));x.lineTo(cx,Y(k.l));x.stroke();
      x.fillRect(cx-cw/2,top,cw,h);
    }
    x.globalAlpha=1;
    const py=Y(price);x.setLineDash([4,5]);x.strokeStyle="rgba(232,184,74,.55)";x.beginPath();x.moveTo(0,py);x.lineTo(W,py);x.stroke();x.setLineDash([]);
    x.fillStyle="rgba(232,184,74,.9)";x.font="600 11px Inter,system-ui,sans-serif";x.textAlign="right";x.fillText(price.toFixed(2),W-8,py-5);
    x.globalCompositeOperation="destination-in";
    const m=x.createLinearGradient(0,0,W,0);m.addColorStop(0,"rgba(0,0,0,0)");m.addColorStop(.22,"rgba(0,0,0,1)");m.addColorStop(.9,"rgba(0,0,0,1)");m.addColorStop(1,"rgba(0,0,0,.2)");
    x.fillStyle=m;x.fillRect(0,0,W,H);
  }
  function frame(t){
    if(window.__bgOff){last=t;requestAnimationFrame(frame);return}
    const dt=Math.min(250,t-last||16);last=t;acc+=dt;
    while(acc>=120){acc-=120;tick()}
    off*=.92;if(off<.05)off=0;
    range();draw();requestAnimationFrame(frame);
  }
  size();cur=fresh();candles.push(cur);
  for(let i=0;i<70*T;i++)tick();off=0;
  for(let i=0;i<40;i++)range();
  addEventListener("resize",()=>{size();draw()});
  draw();if(!reduce)requestAnimationFrame(frame);
})();
</script>

<script id="wolf-js">

function intel(){
  const s=stats(),T=trades,n=T.length;if(!n)return"";
  const P=T.map(net),sc=score(s),rk=R.find(r=>sc>=r[0])[1];
  let cur=0,bw=0,run=0;for(const p of P){run=p>0?(run>0?run+1:1):(run<0?run-1:-1);bw=Math.max(bw,run)}cur=run;
  let rv=0,rvp=0;for(let i=1;i<n;i++){const d=tm(T[i])-tm(T[i-1]);if(P[i-1]<0&&d>=0&&d<=18e5){rv++;rvp+=P[i]}}
  const mean=s.total/n,sd=Math.sqrt(P.reduce((a,p)=>a+(p-mean)**2,0)/n)||1;
  const b=s.al<0?s.aw/-s.al:0,k=b?Math.max(0,s.wr/100-(1-s.wr/100)/b)*50:0;

  if(tdT.length>=Math.max(5,Math.ceil(avg*1.5)))al+=`<div class="al">🐑 <b>Overtrading:</b> ${tdT.length} trades today vs your ${avg.toFixed(1)} average.</div>`;

  const ses=[["Asia 00–07",0,7],["London 07–13",7,13],["New York 13–21",13,21],["Late 21–24",21,24]].map(([l,a,z])=>{const g=T.filter(t=>{const h=hr(t);return h!==null&&h>=a&&h<z});return[l,g.length,g.reduce((x,t)=>x+net(t),0)]}).filter(x=>x[1]);
  const hp=Array(24).fill(0),hn=Array(24).fill(0);T.forEach(t=>{const h=hr(t);if(h!==null){hp[h]+=net(t);hn[h]++}});

  const tl=(k,v,x)=>`<div class="tile"><div class="k">${k}</div><div class="v ${x||""}">${v}</div></div>`;
  return al+`<div class="sec">Pack intel</div><div class="card"><div class="k">Wolf rank</div><div class="rk">${rk}</div><div class="meter"><i style="width:${sc}%;background:linear-gradient(90deg,var(--ember),#fff)"></i></div><div class="sub">Discipline score ${sc}/100 · ${n} trades logged</div>
  <div class="tiles" style="margin-top:12px">${tl("Streak",(cur>0?"+":"")+cur,cur>0?"g":cur<0?"r":"")}${tl("Best run","+"+bw,"g")}${tl("Half-Kelly",k.toFixed(1)+"%")}${tl("Recovery",s.dd?(s.total/s.dd).toFixed(2):"—")}${tl("Consistency",(mean/sd).toFixed(2),cls(mean))}${tl("Revenge",rv+(rv?" · "+money(rvp):""),rvp<0?"r":"")}</div></div>
  ${ses.length?`<div class="card"><h2>Sessions</h2>${bars(ses)}${strip}</div>`:""}

  ${goal>0?`<div class="meter" style="margin-top:12px"><i style="width:${Math.max(0,Math.min(100,mp/goal*100))}%;background:var(--g)"></i></div><div class="sub">${mk}: ${money(mp)} of ${money(goal)} (${(mp/goal*100).toFixed(0)}%)</div>`:""}
