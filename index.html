<script>
const SUPA_URL="https://gsrjzyqeysuysaqudany.supabase.co",SUPA_KEY="sb_publishable_k8L_rApbnITmnT3wi1VDHg_RDuZfwqn";
const TS_KEY="";let tsTok="",fails=0,lock=0;
function mountTs(){if(!TS_KEY||!window.turnstile||!document.getElementById("ts"))return;window.turnstile.render("#ts",{sitekey:TS_KEY,callback:t=>{tsTok=t},"expired-callback":()=>{tsTok=""}})}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const money=n=>(n<0?"−":"")+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=n=>n>0?"g":n<0?"r":"";
let trades=[],reviews={},cfg={start:0},tab="dash",edit=null,delId=null,shot="",errMsg="";
let calM=new Date(new Date().getFullYear(),new Date().getMonth(),1),selDay=null;
let dp=null,all=[],accts=[],active="",uname="",sb=null,sync="Connecting…",store=null,assets=null,dl=null,cloud=false,rt=null;
const net=t=>t.pnl-(t.fees||0);

function ingest(docs){
  trades=[];reviews={};cfg={start:0};
  for(const d of docs){
    if(d.id.startsWith("t_"))trades.push(d);
    else if(d.id.startsWith("d_"))reviews[d.date]=d.text||"";
    else if(d.id==="cfg")cfg=Object.assign({start:0},d);
  }
  trades.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  all=trades;applyAcct();
}
function applyAcct(){
  accts=(cfg.accounts&&cfg.accounts.length)?cfg.accounts.map(a=>Object.assign({},a)):[{id:"a_main",name:"Main account",start:Number(cfg.start)||0}];
  active=accts.some(a=>a.id===cfg.active)?cfg.active:accts[0].id;
  trades=all.filter(t=>(t.acct||accts[0].id)===active);
}
function commitCfg(id){cfg={accounts:accts,active:id};applyAcct();render();save("cfg",{accounts:accts,active:id})}
function switchAcct(id){commitCfg(id)}
function addAcct(){const v=document.getElementById("f_new").value.trim();if(!v)return;const id="a_"+Date.now().toString(36);accts=accts.concat([{id,name:v,start:0}]);commitCfg(id)}
function renameAcct(v){v=v.trim();if(!v)return;const a=accts.find(x=>x.id===active);if(a){a.name=v;commitCfg(active)}}
function refresh(){
  const a=document.activeElement;
  if(tab==="add"||(a&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)))badge();else render();
}
function badge(){const b=$("#sync");if(b)b.textContent=sync}
async function save(k,o){
  sync="";badge();
  try{await store.put(k,o);sync=cloud?"":""}
  catch(e){sync="Save failed ("+((e&&e.code)||"error")+")"}
  badge();
}
async function remove(k){
  try{await store.del(k);sync=cloud?"":""}
  catch(e){sync="Delete failed ("+((e&&e.code)||"error")+")"}
  badge();
}

function stats(){
  const n=trades.length,start=Number((accts.find(a=>a.id===active)||{}).start)||0;
  let eq=start,peak=start,dd=0,ddp=0,gw=0,gl=0,w=0,sr=0,rc=0;
  const pts=[start],by={},wd=[0,0,0,0,0,0,0],wn=[0,0,0,0,0,0,0];
  for(const t of trades){
    const p=net(t);eq+=p;pts.push(eq);
    if(eq>peak)peak=eq;
    const d=peak-eq;if(d>dd){dd=d;ddp=peak>0?d/peak*100:0}
    if(p>0){gw+=p;w++}else if(p<0)gl+=-p;
    if(t.risk>0){sr+=p/t.risk;rc++}
    const dd0=new Date(t.date).getDay();if(!isNaN(dd0)){wd[dd0]+=p;wn[dd0]++}const s=t.setup||"Untagged";by[s]=by[s]||{n:0,p:0};by[s].n++;by[s].p+=p;
  }
  const total=eq-start;
  return {n,total,eq,wr:n?w/n*100:0,pf:gl>0?gw/gl:(gw>0?Infinity:null),
    aw:w?gw/w:0,al:(n-w)?-gl/(n-w):0,ex:n?total/n:0,dd,ddp,r:rc?sr/rc:null,pts,by,wd,wn,
    best:n?Math.max(...trades.map(net)):0,worst:n?Math.min(...trades.map(net)):0};
}
function curve(pts){
  if(pts.length<2)return "";
  const W=320,H=120,mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1;
  const xy=pts.map((v,i)=>[(i/(pts.length-1))*W,H-6-((v-mn)/rg)*(H-12)]);
  const line=xy.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Equity curve"><polygon points="0,${H} ${line} ${W},${H}" fill="var(--ac)" opacity=".13"/><polyline points="${line}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

function vDash(){
  const s=stats();
  const pf=s.pf===null?"—":(s.pf===Infinity?"∞":s.pf.toFixed(2));
  let h=`<div class="card"><div class="k">Net profit / loss</div><div class="v ${cls(s.total)}" style="font-size:30px">${money(s.total)}</div><div class="sub">${s.n} trade${s.n===1?"":"s"} · balance ${money(s.eq)}</div></div>`;
  if(!s.n)return h+`<div class="card empty">No trades yet. Tap <b>Add</b> to log your first one.</div>`+startCard();
  h+=`<div class="card">${curve(s.pts)}</div><div class="grid">`;
  const c=(k,v,x)=>`<div class="card" style="margin:0"><div class="k">${k}</div><div class="v ${x||""}">${v}</div></div>`;
  h+=c("Win rate",s.wr.toFixed(1)+"%")+c("Profit factor",pf)+c("Avg win",money(s.aw),"g")+c("Avg loss",money(s.al),"r")
   +c("Expectancy",money(s.ex),cls(s.ex))+c("Avg R",s.r===null?"—":s.r.toFixed(2)+"R",s.r?cls(s.r):"")
   +c("Max drawdown",(s.dd?"−":"")+money(s.dd)+(s.ddp?` (${s.ddp.toFixed(1)}%)`:""),s.dd?"r":"")+c("Best / worst",money(s.best)+" / "+money(s.worst))
   +`</div><div class="card" style="margin-top:12px"><h2>By setup</h2>`;
  const ent=Object.entries(s.by).sort((a,b)=>b[1].p-a[1].p),mx=Math.max(...ent.map(e=>Math.abs(e[1].p)))||1;
  for(const [k,v] of ent)h+=`<div style="margin-bottom:10px"><div class="tr"><span>${esc(k)} <span class="sub">· ${v.n}</span></span><b class="${cls(v.p)}">${money(v.p)}</b></div><div class="bar" style="width:${Math.max(2,Math.abs(v.p)/mx*100)}%;background:var(${v.p<0?"--r":"--g"})"></div></div>`;
  h+=`</div><div class="card"><h2>By weekday</h2>`;
  const nm=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],mw=Math.max(...s.wd.map(Math.abs))||1;
  for(let i=1;i<=6;i++){const k=i%7;if(!s.wn[k])continue;h+=`<div style="margin-bottom:10px"><div class="tr"><span>${nm[k]} <span class="sub">· ${s.wn[k]}</span></span><b class="${cls(s.wd[k])}">${money(s.wd[k])}</b></div><div class="bar" style="width:${Math.max(2,Math.abs(s.wd[k])/mw*100)}%;background:var(${s.wd[k]<0?"--r":"--g"})"></div></div>`}
  return h+`</div>`+startCard();
}
function startCard(){
  const a=accts.find(x=>x.id===active)||{name:"",start:0};
  return `<div class="card"><h2>Trading accounts</h2><div class="chips">${accts.map(x=>`<button style="${x.id===active?"background:var(--gold);color:var(--on);border-color:var(--gold);font-weight:600":""}" onclick="switchAcct('${x.id}')">${esc(x.name)}</button>`).join("")}</div>
  <label for="f_an">Account name</label><input id="f_an" value="${esc(a.name)}" onchange="renameAcct(this.value)">
  <label for="f_start">Starting balance ($)</label><input id="f_start" type="number" inputmode="decimal" step="any" min="0" value="${esc(a.start||"")}" onchange="setStart(this.value)">
  <div class="row2" style="margin-top:12px"><input id="f_new" placeholder="New account name"><button class="btn sm" style="width:100%" onclick="addAcct()">Add account</button></div>
  ${sb?`<label for="f_name">Your name</label><input id="f_name" value="${esc(uname)}" onchange="setName(this.value)">`:""}${instBlock()}</div>`;
}
function setName(v){uname=v.trim();if(sb)sb.auth.updateUser({data:{name:uname}})}
function setStart(v){
  const n=v===""?0:Number(v);
  if(!isFinite(n)||n<0)return;
  const a=accts.find(x=>x.id===active);if(a){a.start=n;commitCfg(active)}
}

function tradeCard(t){
  const p=net(t),conf=delId===t.id;
  return `<div class="card"><div class="tr"><div><b>${esc(t.symbol)}</b> <span class="badge">${t.side==="buy"?"BUY":"SELL"}</span><div class="sub">${esc(t.date.replace("T"," "))} · ${t.lots} lot${t.lots===1?"":"s"}</div></div><div style="text-align:right"><b class="${cls(p)}" style="font-size:18px">${money(p)}</b>${t.risk>0?`<div class="sub">${(p/t.risk).toFixed(2)}R</div>`:""}</div></div>
  <div class="tags">${t.entry} → ${t.exit}${t.sl?` · SL ${t.sl}`:""}${t.tp?` · TP ${t.tp}`:""}${t.fees?` · fees ${money(t.fees)}`:""}</div>
  ${(t.setup||t.mood)?`<div class="tags">${[t.setup,t.mood].filter(Boolean).map(esc).join(" · ")}</div>`:""}
  ${t.notes?`<div style="margin-top:8px;white-space:pre-wrap">${esc(t.notes)}</div>`:""}
  ${t.shot?`<a href="${esc(t.shot)}" target="_blank" rel="noopener"><img class="shot" src="${esc(t.shot)}" alt="Trade screenshot"></a>`:""}
  <div class="acts"><button class="btn s sm" onclick="act('edit','${t.id}')">Edit</button><button class="btn s sm" style="${conf?"color:var(--r);border-color:var(--r)":""}" onclick="act('del','${t.id}')">${conf?"Tap again to delete":"Delete"}</button></div></div>`;
}
function vTrades(){
  let h=`<div class="tr" style="margin-bottom:12px;align-items:center"><h2 style="margin:0">All trades</h2>${trades.length?`<button class="btn s sm" onclick="act('csv')">Export CSV</button>`:""}</div>`;
  if(!trades.length)return h+`<div class="card empty">Nothing here yet.</div>`;
  return h+trades.slice().reverse().map(tradeCard).join("");
}

function vCal(){
  const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const day={};for(const t of trades){const k=t.date.slice(0,10);day[k]=(day[k]||0)+net(t)}
  let mt=0;for(let d=1;d<=days;d++)mt+=day[`${y}-${pad(m+1)}-${pad(d)}`]||0;
  let h=`<div class="card"><div class="tr" style="align-items:center;margin-bottom:10px"><button class="btn s sm" onclick="act('mon',-1)" aria-label="Previous month">‹</button><div style="text-align:center"><b>${calM.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><div class="sub ${cls(mt)}">${money(mt)}</div></div><button class="btn s sm" onclick="act('mon',1)" aria-label="Next month">›</button></div><div class="cal">`;
  for(const d of ["S","M","T","W","T","F","S"])h+=`<div class="h">${d}</div>`;
  for(let i=0;i<first;i++)h+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const k=`${y}-${pad(m+1)}-${pad(d)}`,v=day[k],bg=v==null?"":`background:color-mix(in srgb,var(${v>=0?"--g":"--r"}) 24%,var(--bg))`;
    h+=`<button class="${k===selDay?"sel":""}" style="${bg}" onclick="act('day','${k}')">${d}${v==null?"":`<small class="${cls(v)}">${Math.abs(v)>=1000?(v/1000).toFixed(1)+"k":Math.round(v)}</small>`}</button>`;
  }
  h+=`</div></div>`;
  if(selDay){
    const dt=trades.filter(t=>t.date.slice(0,10)===selDay);

function tips(){
  const s=stats(),o=[];let st=0,sg=0;
  for(let i=trades.length-1;i>=0;i--){const p=net(trades[i]),g=p>0?1:p<0?-1:0;if(!g||(sg&&g!==sg))break;sg=g;st++}
  if(st>=2)o.push([sg>0?"g":"r",`Current streak: ${st} ${sg>0?"wins":"losses"} in a row.`+(sg<0&&st>=3?" Consider pausing and reviewing before the next trade.":"")]);
  const es=Object.entries(s.by).filter(e=>e[0]!=="Untagged").sort((a,b)=>b[1].p-a[1].p);
  if(es.length)o.push([es[0][1].p>=0?"g":"",`Best setup: ${esc(es[0][0])}, ${money(es[0][1].p)} over ${es[0][1].n} trade${es[0][1].n===1?"":"s"}.`]);
  if(es.length>1&&es[es.length-1][1].p<0)o.push(["r",`Weakest setup: ${esc(es[es.length-1][0])}, ${money(es[es.length-1][1].p)}. Trade it less or tighten the rules.`]);
  const mo={};for(const t of trades)if(t.mood){mo[t.mood]=mo[t.mood]||{n:0,p:0};mo[t.mood].n++;mo[t.mood].p+=net(t)}
  const me=Object.entries(mo).filter(e=>e[1].n>=2).map(e=>[e[0],e[1].p/e[1].n,e[1].n]).sort((a,b)=>a[1]-b[1]);
  if(me.length&&me[0][1]<0)o.push(["r",`Trades taken while feeling ${esc(me[0][0].toLowerCase())} average ${money(me[0][1])} (${me[0][2]} trades). Watch that state.`]);
  if(me.length&&me[me.length-1][1]>0)o.push(["g",`You trade best when ${esc(me[me.length-1][0].toLowerCase())}: ${money(me[me.length-1][1])} per trade.`]);
  const dd=[0,1,2,3,4,5,6].filter(k=>s.wn[k]>=2);
  if(dd.length>1){dd.sort((a,b)=>s.wd[b]/s.wn[b]-s.wd[a]/s.wn[a]);const b=dd[0],w=dd[dd.length-1];
    o.push(["g",`Best day: ${nmD[b]}, ${money(s.wd[b]/s.wn[b])} per trade.`]);
    if(s.wd[w]<0)o.push(["r",`Worst day: ${nmD[w]}, ${money(s.wd[w]/s.wn[w])} per trade.`])}
  const nsl=trades.filter(t=>!(t.sl>0)).length;
  if(nsl)o.push(["r",`${nsl} of ${trades.length} trades have no stop loss recorded. Protecting every trade is the biggest edge you control.`]);
  if(s.pf!==null&&s.pf!==Infinity&&s.pf<1)o.push(["r","Profit factor is below 1.00: losses currently outweigh wins."]);
  if(s.aw&&s.al&&s.aw/Math.abs(s.al)<1)o.push(["",`Average win is smaller than average loss (ratio ${(s.aw/Math.abs(s.al)).toFixed(2)}). Let winners run or cut losers sooner.`]);
  return o;
}
function score(s){
  const sl=trades.filter(t=>t.sl>0).length/trades.length,bad=trades.filter(t=>/^(Revenge|FOMO|Greedy)$/.test(t.mood)).length/trades.length;
  const pf=s.pf===null?0:Math.min(s.pf===Infinity?2:s.pf,2)/2;

function answer(q){
  const s=stats();if(!s.n)return"Add a few trades first and I’ll analyse them for you.";
  const l=q.toLowerCase(),now=Date.now();let T=trades,lab="overall";
  const cut=(d,n)=>{T=trades.filter(t=>new Date(t.date).getTime()>=now-d*864e5);lab=n};
  if(/today/.test(l)){const k=new Date(now-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);T=trades.filter(t=>t.date.slice(0,10)===k);lab="today"}
  else if(/week/.test(l))cut(7,"in the last 7 days");else if(/month/.test(l))cut(30,"in the last 30 days");else if(/year/.test(l))cut(365,"in the last 12 months");
  const u=subst(T),tp=tips(),has=r=>tp.filter(x=>r.test(x[1])).map(x=>x[1].replace(/&amp;/g,"&")).join("\n");
  if(/setup|strategy/.test(l))return has(/setup/)||"Tag your trades with a setup name and I’ll rank them.";
  if(/day|weekday/.test(l))return has(/day:/)||"I need at least 2 trades on a few different weekdays to compare them.";
  if(/mood|emotion|feel|psych|mindset/.test(l))return has(/feeling|trade best/)||"Record your mindset on a few trades and I’ll compare them.";
  if(/drawdown/.test(l))return `Your maximum drawdown is ${money(s.dd)}${s.ddp?` (${s.ddp.toFixed(1)}% from peak)`:""}.`;
  if(/streak/.test(l))return has(/streak/)||"You’re not on a streak right now.";
  if(/win ?rate|winrate/.test(l))return `Win rate ${lab}: ${u.wr.toFixed(1)}% across ${u.n} trade${u.n===1?"":"s"}.`;
  if(/profit factor/.test(l))return u.pf===null?"No losing trades yet, so profit factor can’t be calculated.":`Profit factor ${lab}: ${u.pf===Infinity?"∞":u.pf.toFixed(2)}. Above 1.5 is healthy.`;
  if(/\br\b|r.multiple|risk/.test(l))return s.r===null?"Add a risk amount to your trades (it fills automatically for gold) to get R multiples.":`Your average result is ${s.r.toFixed(2)}R per trade.`;
  if(/expectan|average|avg/.test(l))return `Average per trade: ${money(s.ex)}. Average win ${money(s.aw)}, average loss ${money(s.al)}.`;
  if(/how many|number|count/.test(l))return `You have logged ${u.n} trade${u.n===1?"":"s"} ${lab}.`;
  if(/advice|improve|tip|suggest|weak|wrong|better|should|help/.test(l))return tp.filter(x=>x[0]!=="g").slice(0,3).map(x=>x[1].replace(/&amp;/g,"&")).join("\n")||"Nothing alarming. Keep logging and keep your rules consistent.";
  if(/profit|loss|made|lost|net|p&l|pnl|perform|doing|result/.test(l))return `${lab[0].toUpperCase()+lab.slice(1)}: ${money(u.p)} over ${u.n} trade${u.n===1?"":"s"}, win rate ${u.wr.toFixed(1)}%.`;
  return "I can answer questions like: How am I doing this month? What is my best setup? Which day should I avoid? What is my drawdown? How can I improve?";
}

  const per=Math.abs(calc(sy,en,sl,1,1)),risk=bal*r/100;
  o.textContent=`${(risk/per).toFixed(2)} lots, risking ${money(risk)} (${r}% of ${money(bal)})`;
}
function proj(){
  if(trades.length<10)return "";
  const R=trades.map(net),N=50,S=500,res=[];
  for(let i=0;i<S;i++){let e=0;for(let k=0;k<N;k++)e+=R[Math.floor(Math.random()*R.length)];res.push(e)}
  res.sort((a,b)=>a-b);const q=p=>res[Math.floor(p*(S-1))],pos=res.filter(v=>v>0).length/S*100;
  return `<div class="card"><h2>Future projection</h2><div class="sub">500 simulations of your next ${N} trades, resampled from your own results.</div><div class="grid" style="margin-top:10px"><div><div class="k">Likely case</div><div class="v ${cls(q(.5))}">${money(q(.5))}</div></div><div><div class="k">Chance of profit</div><div class="v">${pos.toFixed(0)}%</div></div><div><div class="k">Bad case (5%)</div><div class="v r">${money(q(.05))}</div></div><div><div class="k">Good case (95%)</div><div class="v g">${money(q(.95))}</div></div></div></div>`;
}
function render(){
  const names={dash:"Home",trades:"Trades",add:"Add",cal:"Calendar",ins:"AI"};
  const ic={dash:"🏠",trades:"📒",add:"＋",cal:"🗓",ins:"🧠"};
  $("#nav").innerHTML=Object.keys(names).map(k=>`<button class="${tab===k?"on":""}" onclick="act('tab','${k}')"><i>${ic[k]}</i>${names[k]}</button>`).join("");
  const body={dash:vDash,trades:vTrades,add:vAdd,cal:vCal,ins:vIns}[tab]();
  $("#app").innerHTML=`<div class="top"><div><h1>Bigman Capital</h1><div class="hello">${uname?`${hi()}, <b>${esc(uname)}</b> 👋`:"Trading Journal"}</div></div><span class="sub">${accts.length>1?`<select class="acs" onchange="switchAcct(this.value)">${accts.map(a=>`<option value="${a.id}" ${a.id===active?"selected":""}>${esc(a.name)}</option>`).join("")}</select>`:""}<span id="sync">${esc(sync)}</span>${sb&&cloud?` · <a href="#" onclick="signOut();return false" style="color:var(--mut)">Sign out</a>`:""}</span></div>`+body;
  if(tab==="add")bindAuto();
}
function mkStore(m,persist){
  const emit=()=>{ingest(Object.keys(m).map(k=>Object.assign({id:k},m[k])));refresh()};
  emit();
  return {
    put:async(k,o)=>{m[k]=o;emit();await persist("put",k,o)},
    del:async k=>{delete m[k];emit();await persist("del",k)}
  };
}
function startLocal(msg){
  let m={};try{m=JSON.parse(localStorage.getItem("tj")||"{}")}catch(e){}
  sync=msg||"This device only";
  store=mkStore(m,async()=>{try{localStorage.setItem("tj",JSON.stringify(m))}catch(e){throw{code:"storage"}}});
}
async function startCloud(session){
  const uid=session.user.id,md=session.user.user_metadata||{};
  uname=String(md.name||(session.user.email||"").split("@")[0]||"").trim();if(!md.name&&uname)uname=uname[0].toUpperCase()+uname.slice(1);
  const {data,error}=await sb.from("journal").select("id,data");
  if(error){sync="Cloud error ("+(error.code||"load")+")";startLocal(sync);return}
  const m={};for(const r of data)m[r.id]=r.data;
  cloud=true;sync="";
  store=mkStore(m,async(op,k,o)=>{
    const r=op==="put"?await sb.from("journal").upsert({user_id:uid,id:k,data:o}):await sb.from("journal").delete().eq("id",k);
    if(r.error)throw{code:r.error.code||"error"};
  });
  render();
}
async function signOut(){await sb.auth.signOut();location.reload()}
let mode="in";
function m(t,ok){const el=$("#l_m");if(el){el.textContent=t;el.style.color=ok?"var(--g)":"var(--r)"}}
function login(msg,ok){
  $("#nav").innerHTML="";
  const up=mode==="up";
  $("#app").innerHTML=`<div class="top"><div><h1>Bigman Capital</h1><div class="sub" style="letter-spacing:.16em;text-transform:uppercase;font-size:10px">Trading Journal</div></div></div>
  <div class="card"><div class="seg"><button class="${up?"":"on"}" onclick="mode='in';login()">Sign in</button><button class="${up?"on":""}" onclick="mode='up';login()">Create account</button></div>
  <div class="sub">${up?"Your own private journal. Your trades are visible only to you and sync to every device you sign in on.":"Welcome back. Sign in to see your journal on this device."}</div>
  ${up?`<label for="l_n">Your name</label><input id="l_n" autocomplete="given-name" placeholder="e.g. Brian">`:""}
  <label for="l_e">Email</label><input id="l_e" type="email" autocomplete="username">
  <label for="l_p">Password${up?" (8+ characters)":""}</label><input id="l_p" type="password" autocomplete="${up?"new-password":"current-password"}">
  ${up?`<label for="l_p2">Confirm password</label><input id="l_p2" type="password" autocomplete="new-password">`:""}
  <div id="ts" style="margin-top:10px"></div><div class="err" id="l_m" style="${ok?"color:var(--g)":""}">${esc(msg||"")}</div>
  <button class="btn" onclick="doAuth()">${up?"Create my account":"Sign in"}</button>
  ${up?"":`<button class="btn s" onclick="forgot()">Forgot password?</button>`}</div>`;
  setTimeout(mountTs,60);
}
async function doAuth(){
  const e=$("#l_e").value.trim(),p=$("#l_p").value,nm=mode==="up"?$("#l_n").value.trim():"";
  if(mode==="up"&&!nm)return m("Please enter your name.");
  if(!e||!p)return m("Enter your email and password.");
  if(Date.now()<lock)return m("Too many attempts. Please wait a moment and try again.");
  if(TS_KEY&&!tsTok)return m("Please complete the security check.");
  if(mode==="up"){
    if(p.length<8)return m("Use a password of at least 8 characters.");
    if(p!==$("#l_p2").value)return m("The passwords don’t match.");
    const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{name:nm},captchaToken:tsTok||undefined}});
    if(error)return m("Sign-up failed: "+error.message);
    if(data.session)return startCloud(data.session);
    mode="in";return login("Account created. Check your email to confirm it, then sign in.",1);
  }
  const {data,error}=await sb.auth.signInWithPassword({email:e,password:p,options:{captchaToken:tsTok||undefined}});
  if(error){if(++fails>=5){lock=Date.now()+30000;fails=0}if(window.turnstile&&TS_KEY){turnstile.reset();tsTok=""}return m("Sign-in failed: "+error.message)}
  await startCloud(data.session);
}
async function forgot(){
  const e=$("#l_e").value.trim();if(!e)return m("Enter your email first.");
  const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname,captchaToken:tsTok||undefined});
  m(error?error.message:"Reset link sent. Check your email.",!error);
}
function resetForm(){
  $("#nav").innerHTML="";
  $("#app").innerHTML=`<div class="top"><div><h1>Bigman Capital</h1></div></div><div class="card"><h2>Choose a new password</h2><label for="n_p">New password (8+ characters)</label><input id="n_p" type="password" autocomplete="new-password"><div class="err" id="l_m"></div><button class="btn" onclick="setPw()">Save password</button></div>`;
}
async function setPw(){
  const p=$("#n_p").value;if(p.length<8)return m("Use at least 8 characters.");
  const {error}=await sb.auth.updateUser({password:p});
  if(error)return m(error.message);
  location.replace(location.origin+location.pathname);
}
(async()=>{
  const ok=window.supabase&&SUPA_URL.startsWith("https://")&&!SUPA_KEY.startsWith("PASTE");
  if(!ok){startLocal("Preview mode: saved on this device only");render();return}
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")resetForm()});
  const {data}=await sb.auth.getSession();
  if(data.session)await startCloud(data.session);else login();
})();
</script><script>
(function(){
  const c=document.getElementById("bg"),x=c.getContext("2d"),reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const UP="#22c55e",DN="#ef4444",T=40;
  let W=0,H=0,cw=10,gap=5,candles=[],cur,price=2650.0,vol=1.1,ticks=0,off=0,lo=2640,hi=2660,last=0,acc=0;
  const g=()=>{let u=0;for(let i=0;i<6;i++)u+=Math.random();return(u-3)/.707};
  const fresh=()=>{const o=cur?cur.c:price;return{o,h:o,l:o,c:o}};
  function tick(){
    vol=Math.max(.4,Math.min(2.6,vol*.96+.04*1.1+Math.abs(g())*.05));
    price+=g()*vol*.55+(Math.random()<.015?g()*vol*3:0);
    cur.c=price;cur.h=Math.max(cur.h,price);cur.l=Math.min(cur.l,price);
    if(++ticks>=T){ticks=0;candles.push(cur=fresh());if(candles.length>90)candles.shift();off+=cw+gap}
  }
  function size(){
    const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    cw=Math.max(7,Math.min(14,W/38));gap=Math.max(3,cw*.45);
  }
  function range(){
    const n=Math.ceil(W*.9/(cw+gap)),v=candles.slice(-n);let a=1e9,b=-1e9;
    for(const k of v){if(k.l<a)a=k.l;if(k.h>b)b=k.h}
    const pad=(b-a)*.18+.5;lo+=(a-pad-lo)*.04;hi+=(b+pad-hi)*.04;
  }
  const Y=p=>H*.1+(1-(p-lo)/(hi-lo))*H*.62;
  function draw(){
    x.globalCompositeOperation="source-over";x.clearRect(0,0,W,H);
    x.strokeStyle="rgba(128,140,170,.09)";x.lineWidth=1;
    for(let i=1;i<9;i++){const y=H*.1+H*.62*i/9;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
    const xr=W*.82,n=candles.length;
    for(let i=0;i<n;i++){
      const k=candles[i],cx=xr-(n-1-i)*(cw+gap)-off;if(cx<-cw||cx>W+cw)continue;
      const up=k.c>=k.o,col=up?UP:DN,yo=Y(k.o),yc=Y(k.c),top=Math.min(yo,yc),h=Math.max(1.5,Math.abs(yo-yc));
      x.globalAlpha=.8;x.strokeStyle=col;x.fillStyle=col;x.lineWidth=1.4;
      x.beginPath();x.moveTo(cx,Y(k.h));x.lineTo(cx,Y(k.l));x.stroke();
      x.fillRect(cx-cw/2,top,cw,h);
    }
    x.globalAlpha=1;
    const py=Y(price);x.setLineDash([4,5]);x.strokeStyle="rgba(232,184,74,.55)";x.beginPath();x.moveTo(0,py);x.lineTo(W,py);x.stroke();x.setLineDash([]);
    x.fillStyle="rgba(232,184,74,.9)";x.font="600 11px Inter,system-ui,sans-serif";x.textAlign="right";x.fillText(price.toFixed(2),W-8,py-5);
    x.globalCompositeOperation="destination-in";
    const m=x.createLinearGradient(0,0,W,0);m.addColorStop(0,"rgba(0,0,0,0)");m.addColorStop(.22,"rgba(0,0,0,1)");m.addColorStop(.9,"rgba(0,0,0,1)");m.addColorStop(1,"rgba(0,0,0,.2)");
    x.fillStyle=m;x.fillRect(0,0,W,H);
  }
  function frame(t){
    const dt=Math.min(250,t-last||16);last=t;acc+=dt;
    while(acc>=120){acc-=120;tick()}
    off*=.92;if(off<.05)off=0;
    range();draw();requestAnimationFrame(frame);
  }
  size();cur=fresh();candles.push(cur);
  for(let i=0;i<70*T;i++)tick();off=0;
  for(let i=0;i<40;i++)range();
  addEventListener("resize",()=>{size();draw()});
  draw();if(!reduce)requestAnimationFrame(frame);
})();
</script>
