/* ---------- periods & stats ---------- */
function cut(){const n=new Date(),d=x=>dk(new Date(n.getTime()-x*864e5));return per==="7D"?d(7):per==="30D"?d(30):per==="90D"?d(90):per==="YTD"?n.getFullYear()+"-01-01":""}
function vt(){const c=cut();return c?trades.filter(t=>t.date.slice(0,10)>=c):trades}
function setPer(p){per=p;pageAnim=false;render()}
function perBar(){return `<div class="per noprint" role="group" aria-label="Period">${[["7D","7 days"],["30D","30 days"],["90D","90 days"],["YTD","This year"],["ALL","All time"]].map(([k,l])=>`<button class="${per===k?"on":""}" aria-pressed="${per===k}" onclick="setPer('${k}')">${l}</button>`).join("")}</div>`}
function pipSize(sy){if(/JPY$/.test(sy))return .01;if(sy==="XAUUSD"||sy==="XAUEUR")return .1;if(sy==="XAGUSD")return .01;if(/^(BTC|ETH|SOL|BNB|XRP|LTC|ADA|DOGE)/.test(sy))return 1;if(/^(US30|NAS100|SPX500|GER40|UK100|JPN225)$/.test(sy))return 1;if(/OIL$/.test(sy))return .01;return .0001}
const pips=t=>(t.exit-t.entry)*(t.side==="buy"?1:-1)/pipSize(t.symbol);
function sess(t){const h=+t.date.slice(11,13);if(isNaN(h))return null;const u=(h-S.tz+48)%24;return u>=21||u<7?"Asia / Sydney":u<12?"London":u<16?"London + NY overlap":"New York"}
function dur(t){if(!t.closeDate)return null;const m=(new Date(t.closeDate)-new Date(t.date))/6e4;return isFinite(m)&&m>=0?m:null}
function fmtDur(m){if(m==null)return"—";if(m<60)return Math.round(m)+"m";if(m<1440)return (m/60).toFixed(1)+"h";return (m/1440).toFixed(1)+"d"}
function stats(T,full){
  T=T||vt();const c=full?"":cut(),A=acct(),start=Number(A.start)||0;
  const base=start+(c?trades.filter(t=>t.date.slice(0,10)<c).reduce((s,t)=>s+net(t),0):0);
  let eq=base,peak=base,dd=0,ddp=0,gw=0,gl=0,w=0,sr=0,rc=0,cw=0,cl=0,mw=0,ml=0,sp=0,ss=0;
  const pts=[{l:"Start",v:base}],uw=[{l:"Start",v:0}],by={},wd=[0,0,0,0,0,0,0],wn=[0,0,0,0,0,0,0],vals=[];
  for(const t of T){
    const p=net(t);vals.push(p);eq+=p;pts.push({l:t.date.slice(0,16).replace("T"," "),v:eq});
    if(eq>peak)peak=eq;const d=peak-eq;if(d>dd){dd=d;ddp=peak>0?d/peak*100:0}
    uw.push({l:t.date.slice(0,16).replace("T"," "),v:peak>0?-d/peak*100:0});
    if(p>0){gw+=p;w++;cw++;cl=0}else if(p<0){gl+=-p;cl++;cw=0}else{cw=0;cl=0}
    mw=Math.max(mw,cw);ml=Math.max(ml,cl);
    if(t.risk>0){sr+=p/t.risk;rc++}
    const d0=new Date(t.date).getDay();if(!isNaN(d0)){wd[d0]+=p;wn[d0]++}
    const s=t.setup||"Untagged";by[s]=by[s]||{n:0,p:0};by[s].n++;by[s].p+=p;
    if(t.entry>0&&t.exit>0){sp+=pips(t);ss++}
  }
  const n=T.length,total=eq-base,mean=n?total/n:0,sd=n>1?Math.sqrt(vals.reduce((a,v)=>a+(v-mean)**2,0)/(n-1)):0;
  const aw=w?gw/w:0,al=(n-w)?-gl/(n-w):0,wr=n?w/n*100:0,pf=gl>0?gw/gl:(gw>0?Infinity:null);
  const kelly=aw&&al&&al<0?(wr/100-(1-wr/100)/(aw/Math.abs(al)))*100:null;
  return {n,total,eq,base,wr,pf,aw,al,ex:mean,dd,ddp,r:rc?sr/rc:null,pts,uw,by,wd,wn,mw,ml,cw,cl,
    sqn:n>=5&&sd>0?Math.sqrt(Math.min(n,100))*mean/sd:null,rec:dd>0?total/dd:null,kelly,
    avgPips:ss?sp/ss:null,best:n?Math.max(...vals):0,worst:n?Math.min(...vals):0};
}

/* ---------- risk gate ---------- */
function gate(){
  const A=acct(),tk=dk(new Date()),T=trades.filter(t=>t.date.slice(0,10)===tk),td=T.reduce((p,t)=>p+net(t),0),m=[];let lvl="g";
  const up=l=>{if(l==="r"||(l==="warn"&&lvl==="g"))lvl=l};
  if(A.dl&&A.start>0){const lim=A.start*A.dl/100,u=Math.max(0,-td);if(u>=lim){up("r");m.push("Daily loss limit reached. Stop trading for today.")}else if(u>=lim*.7){up("warn");m.push(`${(u/lim*100).toFixed(0)}% of your daily loss limit is used.`)}}
  if(A.mt&&T.length>=A.mt){up("r");m.push(`You have already taken your maximum of ${A.mt} trades today.`)}
  let c=0;for(let i=trades.length-1;i>=0;i--){if(net(trades[i])<0&&trades[i].date.slice(0,10)===tk)c++;else break}
  if(c>=3){up("warn");m.push(`${c} losses in a row today. Take a break before the next trade.`)}
  if(!m.length)m.push("You are within your rules today.");
  return{lvl,m,td,n:T.length};
}

/* ---------- calendar ---------- */
function vCal(){
  const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const day={},cnt={};for(const t of trades){const k=t.date.slice(0,10);day[k]=(day[k]||0)+net(t);cnt[k]=(cnt[k]||0)+1}
  const tk=dk(new Date()),keys=[];for(let d=1;d<=days;d++)keys.push(`${y}-${pad(m+1)}-${pad(d)}`);
  const ac=keys.filter(k=>day[k]!==undefined),mt=ac.reduce((a,k)=>a+day[k],0),gd=ac.filter(k=>day[k]>0).length,rd=ac.filter(k=>day[k]<0).length;
  const bk=ac.length?ac.reduce((a,k)=>day[k]>day[a]?k:a,ac[0]):null,wk=ac.length?ac.reduce((a,k)=>day[k]<day[a]?k:a,ac[0]):null;
  const mx=Math.max(1,...ac.map(k=>Math.abs(day[k])));
  let h=`<div class="card"><div class="tr" style="align-items:center;margin-bottom:10px"><button class="btn s sm" onclick="act('mon',-1)" aria-label="Previous month">‹</button><div style="text-align:center"><b>${calM.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><div class="sub ${cls(mt)}">${money(mt)}</div></div><button class="btn s sm" onclick="act('mon',1)" aria-label="Next month">›</button></div><div class="cal">`;
  for(const d of ["S","M","T","W","T","F","S"])h+=`<div class="h">${d}</div>`;
  for(let i=0;i<first;i++)h+=`<div></div>`;
  for(const k of keys){
    const v=day[k],bg=v==null?"":`background:color-mix(in srgb,var(${v>=0?"--g":"--r"}) ${Math.round(14+Math.abs(v)/mx*36)}%,var(--bg))`,d=+k.slice(8),rv=reviews[k];
    h+=`<button class="${k===selDay?"sel":""}${k===tk?" today":""}" style="${bg}" aria-label="${k}${v==null?", no trades":`, ${cnt[k]} trade${cnt[k]===1?"":"s"}, ${money(v)}`}" onclick="act('day','${k}')">${rv&&(rv.text||rv.plan)?`<i class="rv">✎</i>`:""}${d}${v==null?"":`<small class="${cls(v)}">${ms(v)}</small>`}</button>`;
  }
  h+=`</div><div class="tr" style="margin-top:10px;align-items:center"><span class="sub">✎ = journal entry written</span><button class="btn s sm" onclick="act('today')">Today</button></div></div>`;
  h+=`<div class="tiles">${tile("Month P/L",money(mt),cls(mt))}${tile("Trading days",ac.length)}${tile("Green / red",gd+" / "+rd)}${tile("Day win rate",ac.length?(gd/ac.length*100).toFixed(0)+"%":"—")}${tile("Best day",bk?money(day[bk]):"—","g")}${tile("Worst day",wk&&day[wk]<0?money(day[wk]):"—","r")}</div>`;
  const wkr={};for(const k of ac){const d=new Date(k+"T00:00:00"),w=new Date(d);w.setDate(d.getDate()-((d.getDay()+6)%7));const wk0=dk(w);wkr[wk0]=wkr[wk0]||{p:0,n:0};wkr[wk0].p+=day[k];wkr[wk0].n+=cnt[k]}
  const wl=Object.entries(wkr).sort();
  if(wl.length)h+=`<div class="card"><h2>Weekly totals</h2>${wl.map(([k,v])=>`<div class="kv"><span class="sub">Week of ${k.slice(5)} · ${v.n} trades</span><b class="${cls(v.p)}">${money(v.p)}</b></div>`).join("")}</div>`;
  if(selDay){
    const dt=trades.filter(t=>t.date.slice(0,10)===selDay),dm=M(dt),rv=reviews[selDay]||{text:"",plan:"",rate:0};
    h+=`<div class="card"><h2>${esc(selDay)}${dt.length?` · <span class="${cls(dm.p)}">${money(dm.p)}</span>`:""}</h2>`+(dt.length?`<div class="sub" style="margin-bottom:6px">${dt.length} trade${dt.length===1?"":"s"} · win rate ${dm.wr.toFixed(0)}%. Tap a trade for details.</div>`+dt.map(t=>`<div class="rowt" onclick="openTrade('${t.id}')"><span>${esc(t.symbol)} ${t.side==="buy"?"buy":"sell"} · ${t.lots}</span><b class="${cls(net(t))}">${money(net(t))}</b></div>`).join(""):`<div class="sub">No trades recorded this day.</div>`)
     +`<label for="f_plan">Pre-market plan</label><textarea id="f_plan" style="min-height:70px" placeholder="Bias, levels, news, what you will and will not trade today" oninput="reviewInput()">${esc(rv.plan)}</textarea>
     <label for="f_rev">Daily review</label><textarea id="f_rev" placeholder="What went well? What would you change?" oninput="reviewInput()">${esc(rv.text)}</textarea>
     <label for="f_rate">How well did you follow your rules?</label><select id="f_rate" onchange="reviewInput()">${["Not rated","1 · Poor","2 · Weak","3 · Okay","4 · Good","5 · Perfect"].map((l,i)=>`<option value="${i}" ${+rv.rate===i?"selected":""}>${l}</option>`).join("")}</select></div>`;
  }else h+=`<div class="sub" style="text-align:center;margin-top:10px">Tap a day to see its trades and write your plan and review.</div>`;
  return h;
}

function parseCSV(s){
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&s[i+1]==="\n")i++;r.push(c);c="";if(r.some(x=>x!==""))rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(x=>x!==""))rows.push(r);return rows;
}

async function importFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;inp.value="";
  if(f.size>5e6)return toast("File is too large (5 MB max).","err");
  let txt;try{txt=await f.text()}catch(e){return toast("Could not read that file.","err")}
  const out={};let skip=0,ok=0;
  try{
    if(/\.json$/i.test(f.name)){
      const j=JSON.parse(txt),d=j&&j.data;if(!d||typeof d!=="object")throw 0;
      for(const [k,v] of Object.entries(d)){
        if(!v||typeof v!=="object")continue;
        if(k.startsWith("t_")){if(okTrade(v)){out[k]=v;ok++}else skip++}
        else if(/^d_\d{4}-\d{2}-\d{2}$/.test(k)){out[k]={date:String(v.date||k.slice(2)),text:String(v.text||""),plan:String(v.plan||""),rate:+v.rate||0};ok++}
        else if(k==="cfg"&&Array.isArray(v.accounts)){out[k]=v;ok++}
      }
    }else{
      const rows=parseCSV(txt);if(rows.length<2)throw 0;
      const hd=rows[0].map(x=>x.trim().toLowerCase());
      for(const r of rows.slice(1)){
        const o={};hd.forEach((h,i)=>o[h]=(r[i]||"").trim());
        const n=x=>o[x]===""||o[x]==null?null:Number(o[x]);
        const t={acct:active,date:(o.date||"").replace(" ","T").slice(0,16),closeDate:(o.closedate||"").replace(" ","T").slice(0,16),symbol:(o.symbol||"").toUpperCase(),side:(o.side||"").toLowerCase(),lots:n("lots"),entry:n("entry"),exit:n("exit"),sl:n("sl"),tp:n("tp"),pnl:n("pnl"),fees:n("fees")||0,risk:n("risk"),setup:o.setup||"",mood:o.mood||"",grade:o.grade||"",plan:o.plan||"",mistakes:o.mistakes?o.mistakes.split(/;\s*/).filter(Boolean):[],notes:o.notes||"",shot:"",link:""};
        if(okTrade(t)){out["t_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)]=t;ok++}else skip++;
      }
    }
  }catch(e){return toast("That file isn't a valid backup or CSV.","err")}
  if(!ok)return toast("Nothing importable found"+(skip?` (${skip} rows skipped)`:"")+".","err");
  try{await store.many(out);toast(`Imported ${ok} item${ok===1?"":"s"}${skip?`, skipped ${skip}`:""}.`)}catch(e){toast("Import failed. Try again.","err")}
}

  if(/this week|\bweek(ly)?\b/.test(l))return{T:inR(day(dow),day(0)),lab:"this week"};
