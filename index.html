const net=t=>t.pnl-(t.fees||0);

function ingest(docs){
  loading=false;trades=[];reviews={};cfg={start:0};nbDocs=[];
  for(const d of docs){
    if(d.id.startsWith("t_"))trades.push(d);
    else if(d.id.startsWith("d_"))reviews[d.date]=d.text||"";
    else if(d.id==="cfg")cfg=Object.assign({start:0},d);
    else if(d.id.startsWith("nb_"))nbDocs.push(d);
  }
  trades.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  all=trades;applyAcct();
}
function applyAcct(){
  accts=(cfg.accounts&&cfg.accounts.length)?cfg.accounts.map(a=>Object.assign({},a)):[{id:"a_main",name:"Main account",start:Number(cfg.start)||0}];
  active=accts.some(a=>a.id===cfg.active)?cfg.active:accts[0].id;
  trades=all.filter(t=>(t.acct||accts[0].id)===active);
}
function commitCfg(id){cfg={accounts:accts,active:id};applyAcct();render();save("cfg",{accounts:accts,active:id})}

function stats(){
  const n=trades.length,start=Number((accts.find(a=>a.id===active)||{}).start)||0;
  let eq=start,peak=start,dd=0,ddp=0,gw=0,gl=0,w=0,sr=0,rc=0;
  const pts=[start],by={},wd=[0,0,0,0,0,0,0],wn=[0,0,0,0,0,0,0];
  for(const t of trades){
    const p=net(t);eq+=p;pts.push(eq);
    if(eq>peak)peak=eq;
    const d=peak-eq;if(d>dd){dd=d;ddp=peak>0?d/peak*100:0}
    if(p>0){gw+=p;w++}else if(p<0)gl+=-p;
    if(t.risk>0){sr+=p/t.risk;rc++}
    const dd0=new Date(t.date).getDay();if(!isNaN(dd0)){wd[dd0]+=p;wn[dd0]++}const s=t.setup||"Untagged";by[s]=by[s]||{n:0,p:0};by[s].n++;by[s].p+=p;
  }
  const total=eq-start;
  return {n,total,eq,wr:n?w/n*100:0,pf:gl>0?gw/gl:(gw>0?Infinity:null),
    aw:w?gw/w:0,al:(n-w)?-gl/(n-w):0,ex:n?total/n:0,dd,ddp,r:rc?sr/rc:null,pts,by,wd,wn,
    best:n?Math.max(...trades.map(net)):0,worst:n?Math.min(...trades.map(net)):0};
}
function curve(pts){
  if(pts.length<2)return "";
  const W=320,H=120,mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1;
  const xy=pts.map((v,i)=>[(i/(pts.length-1))*W,H-6-((v-mn)/rg)*(H-12)]);
  const line=xy.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Equity curve"><polygon points="0,${H} ${line} ${W},${H}" fill="var(--ac)" opacity=".13"/><polyline points="${line}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

function bars(ent){
  const mx=Math.max(...ent.map(e=>Math.abs(e[2])))||1;
  return ent.map(([k,n,p])=>`<div class="br"><div class="tr"><span>${esc(k)} <span class="sub">· ${n}</span></span><b class="${cls(p)}">${money(p)}</b></div><div class="bar" style="width:${Math.max(2,Math.abs(p)/mx*100)}%;background:var(${p<0?"--r":"--g"})"></div></div>`).join("");
}

  const st=Number(a.start)||0,ret=st>0?s.total/st*100:null,pf=s.pf===null?"—":s.pf===Infinity?"∞":s.pf.toFixed(2);

  <div class="${cls(s.total)}" style="font-weight:600">${s.total>=0?"▲":"▼"} ${money(Math.abs(s.total))}${ret!==null?` (${ret.toFixed(1)}%)`:""} <span class="sub">all time</span></div>

  h+=`<div class="tiles">${tile("Win rate",cu(s.wr,"p","wr"))}${tile("Profit factor",s.pf!==null&&isFinite(s.pf)?cu(s.pf,"n","pf"):pf)}${tile("Expectancy",cu(s.ex,"m","ex"),cls(s.ex))}${tile("Avg win",cu(s.aw,"m","aw"),"g")}${tile("Avg loss",cu(s.al,"m","al"),"r")}${tile("Max drawdown",(s.dd?"−":"")+cu(s.dd,"m","dd"),s.dd?"r":"")}</div>`;
  h+=riskCard(s,a,td);
  h+=`<div class="sec">Recent trades</div><div class="card">${trades.slice(-5).reverse().map(t=>`<div class="rowt" onclick="openTrade('${t.id}')" style="cursor:pointer"><div><b>${esc(t.symbol)}</b> <span class="badge">${t.side==="buy"?"BUY":"SELL"}</span><div class="sub">${esc(t.date.slice(0,16).replace("T"," "))}</div></div><b class="${cls(net(t))}">${money(net(t))}</b></div>`).join("")}<button class="btn s" onclick="act('tab','trades')">View all trades</button></div>`;
  const pr={};for(const t of trades){pr[t.symbol]=pr[t.symbol]||[0,0];pr[t.symbol][0]++;pr[t.symbol][1]+=net(t)}
  const pe=Object.entries(pr).map(([k,v])=>[k,v[0],v[1]]).sort((x,y)=>Math.abs(y[2])-Math.abs(x[2])).slice(0,6);
  h+=`<div class="sec">By pair</div><div class="card">${bars(pe)}</div>`;
  const se=Object.entries(s.by).map(([k,v])=>[k,v.n,v.p]).sort((x,y)=>y[2]-x[2]).slice(0,6);
  h+=`<div class="sec">By setup</div><div class="card">${bars(se)}</div>`;
  const nm=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],we=[1,2,3,4,5,6,0].filter(k=>s.wn[k]).map(k=>[nm[k],s.wn[k],s.wd[k]]);
  if(we.length)h+=`<div class="sec">By weekday</div><div class="card">${bars(we)}</div>`;
  return h+`<div class="sec">Accounts &amp; settings</div>`+startCard();

function vCal(){
  const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const day={},cnt={};for(const t of trades){const k=t.date.slice(0,10);day[k]=(day[k]||0)+net(t);cnt[k]=(cnt[k]||0)+1}
  const tk=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const keys=[];for(let d=1;d<=days;d++)keys.push(`${y}-${pad(m+1)}-${pad(d)}`);
  const ac=keys.filter(k=>day[k]!==undefined),mt=ac.reduce((a,k)=>a+day[k],0),gd=ac.filter(k=>day[k]>0).length,rd=ac.filter(k=>day[k]<0).length;
  const bk=ac.length?ac.reduce((a,k)=>day[k]>day[a]?k:a,ac[0]):null,wk=ac.length?ac.reduce((a,k)=>day[k]<day[a]?k:a,ac[0]):null;
  const tile=(k,v,x)=>`<div class="tile"><div class="k">${k}</div><div class="v ${x||""}">${v}</div></div>`;
  let h=`<div class="card"><div class="tr" style="align-items:center;margin-bottom:10px"><button class="btn s sm" onclick="act('mon',-1)" aria-label="Previous month">‹</button><div style="text-align:center"><b>${calM.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><div class="sub ${cls(mt)}">${money(mt)}</div></div><button class="btn s sm" onclick="act('mon',1)" aria-label="Next month">›</button></div><div class="cal">`;
  for(const d of ["S","M","T","W","T","F","S"])h+=`<div class="h">${d}</div>`;
  for(let i=0;i<first;i++)h+=`<div></div>`;
  for(const k of keys){
    const v=day[k],bg=v==null?"":`background:color-mix(in srgb,var(${v>=0?"--g":"--r"}) 24%,var(--bg))`,d=+k.slice(8);
    h+=`<button class="${k===selDay?"sel":""}${k===tk?" today":""}" style="${bg}" aria-label="${k}${v==null?", no trades":`, ${cnt[k]} trade${cnt[k]===1?"":"s"}, ${money(v)}`}" onclick="act('day','${k}')">${reviews[k]?`<i class="rv">✎</i>`:""}${d}${v==null?"":`<small class="${cls(v)}">${Math.abs(v)>=1000?(v/1000).toFixed(1)+"k":Math.round(v)}</small>`}</button>`;
  }
  h+=`</div><div class="tr" style="margin-top:10px;align-items:center"><span class="sub">✎ = daily review written</span><button class="btn s sm" onclick="act('today')">Today</button></div></div>`;
  h+=`<div class="tiles">${tile("Month P/L",money(mt),cls(mt))}${tile("Trading days",ac.length)}${tile("Green / red",gd+" / "+rd)}${tile("Day win rate",ac.length?(gd/ac.length*100).toFixed(0)+"%":"—")}${tile("Best day",bk?money(day[bk]):"—","g")}${tile("Worst day",wk&&day[wk]<0?money(day[wk]):"—","r")}</div>`;
  if(selDay){
    const dt=trades.filter(t=>t.date.slice(0,10)===selDay),dm=M(dt);
    h+=`<div class="card" style="margin-top:12px"><h2>${esc(selDay)}${dt.length?` · <span class="${cls(dm.p)}">${money(dm.p)}</span>`:""}</h2>`+(dt.length?`<div class="sub" style="margin-bottom:6px">${dt.length} trade${dt.length===1?"":"s"} · win rate ${dm.wr.toFixed(0)}%. Tap a trade for details.</div>`+dt.map(t=>`<div class="dayrow" onclick="openTrade('${t.id}')"><span>${esc(t.symbol)} ${t.side==="buy"?"buy":"sell"} · ${t.lots}</span><b class="${cls(net(t))}">${money(net(t))}</b></div>`).join(""):`<div class="sub">No trades recorded this day.</div>`)
     +`<label for="f_rev">Daily review</label><textarea id="f_rev" placeholder="What went well? What would you change?" oninput="reviewInput(this.value)">${esc(reviews[selDay]||"")}</textarea></div>`;
  }else h+=`<div class="sub" style="text-align:center;margin-top:10px">Tap a day to see its trades and write a review.</div>`;
  return h;
}

}

function calc(sy,en,ex,d,l){
  const v=(ex-en)*d*l;
  if(sy==="XAUUSD")return v*100;
  if(sy==="XAGUSD")return v*5000;
  if(/^(BTC|ETH|SOL|BNB|XRP|LTC|ADA|DOGE)/.test(sy))return v;
  if(/^[A-Z]{6}$/.test(sy)&&!/^(XAU|XAG)/.test(sy)){
    const b=sy.slice(0,3),q=sy.slice(3);
    if(q==="USD")return v*1e5;
    if(b==="USD"&&ex>0)return v*1e5/ex;
  }
  return null;
}

    case "p":case "pl":{let a=1e18,b=1e18,c=-1e18,d=-1e18;for(let i=0;i<o.pts.length;i+=2){a=Math.min(a,o.pts[i]);c=Math.max(c,o.pts[i]);b=Math.min(b,o.pts[i+1]);d=Math.max(d,o.pts[i+1])}const w=o.w*nbMult(o)/2;return [a-w,b-w,c+w,d+w]}

function nbSmooth(ctx,p){
